<style>
:root{
  --wall:#D9E3EE; --wall-dot:#B9C8D8;
  --win:#FFFFFF; --win-bar:#EEF2F7; --line:#C9D4E1; --tint:#F5F7FB;
  --ink:#16202E; --ink-soft:#4A5870;
  --cobalt:#2B46C4; --cobalt-soft:#E3E8FB;
  --sun:#F3BE3E; --sun-ink:#3A2A00;
  --menubar:rgba(255,255,255,.72); --dock:rgba(255,255,255,.62);
  --shadow:0 1px 0 rgba(22,32,46,.06), 0 18px 40px -12px rgba(22,46,90,.28);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wall:#121826; --wall-dot:#232C3F;
    --win:#1B2232; --win-bar:#232B3D; --line:#34405A; --tint:#20283A;
    --ink:#E9EEF6; --ink-soft:#A3AFC4;
    --cobalt:#8EA2FF; --cobalt-soft:#26305A;
    --menubar:rgba(20,26,40,.75); --dock:rgba(28,35,52,.7);
    --shadow:0 18px 44px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --wall:#121826; --wall-dot:#232C3F;
  --win:#1B2232; --win-bar:#232B3D; --line:#34405A; --tint:#20283A;
  --ink:#E9EEF6; --ink-soft:#A3AFC4;
  --cobalt:#8EA2FF; --cobalt-soft:#26305A;
  --menubar:rgba(20,26,40,.75); --dock:rgba(28,35,52,.7);
  --shadow:0 18px 44px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;overflow:hidden;
  font:16px/1.55 var(--body);color:var(--ink);
  background:var(--wall);
  background-image:radial-gradient(var(--wall-dot) 1.2px, transparent 1.3px);
  background-size:22px 22px;
}
button{font:inherit;color:inherit}
a{color:var(--cobalt)}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}

/* Menu bar */
.menubar{position:fixed;top:0;left:0;right:0;z-index:5000;padding-top:env(safe-area-inset-top,0px);background:var(--menubar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.menubar-inner{display:flex;align-items:center;gap:4px;height:40px;padding:0 14px}
.logo{display:flex;align-items:center;gap:8px;font:700 15px var(--display);margin-right:10px;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:6px}
.logo-mark{width:22px;height:22px;border-radius:6px;background:var(--cobalt);color:#fff;display:grid;place-items:center;font:800 11px var(--display)}
.menu-btn{background:none;border:0;padding:5px 9px;border-radius:6px;font-size:14px;cursor:pointer}
.menu-btn:hover{background:var(--cobalt-soft)}
.menubar .spacer{flex:1}
.clock{font:500 13px var(--mono);color:var(--ink-soft);padding:0 6px}
.icon-btn{background:none;border:0;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--cobalt-soft)}
.icon-btn svg{width:18px;height:18px}

/* Desktop */
#desktop{position:fixed;left:0;right:0;top:calc(41px + env(safe-area-inset-top,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.icons{position:absolute;top:18px;display:flex;flex-direction:column;gap:8px}
.icons.left{left:14px}.icons.right{right:14px}
.d-icon{width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:8px 4px;border-radius:10px;cursor:pointer;font-size:13px;line-height:1.25;text-align:center}
.d-icon:hover,.d-icon:focus-visible{background:color-mix(in srgb,var(--cobalt-soft) 70%,transparent)}
.d-icon svg{width:46px;height:46px;filter:drop-shadow(0 4px 6px rgba(22,46,90,.18))}

/* Windows */
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;animation:pop .18s ease-out}
.win.minimized{display:none}
.win.maxed{left:8px!important;top:8px!important;width:calc(100% - 16px)!important;height:calc(100% - 16px)!important;max-height:none!important}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.win-bar{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;flex:none;background:var(--win-bar);border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none}
.win-bar:active{cursor:grabbing}
.lights{display:flex;gap:7px}
.light{width:13px;height:13px;border-radius:50%;border:0;padding:0;cursor:pointer}
.light.close{background:#EE5F57}.light.min{background:#F4BD4F}.light.max{background:#5FC454}
.win-title{font:500 13px var(--mono);color:var(--ink-soft);flex:1;text-align:center;margin-right:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-body{overflow-y:auto;overflow-x:hidden;padding:28px 32px 32px;flex:1;min-height:0}

/* Type */
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0}
h1{font-size:clamp(34px,5vw,50px);font-weight:800;letter-spacing:-.02em}
h2{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
h3{font-size:17px;font-weight:700}
p{margin:0 0 12px;max-width:64ch}
.muted{color:var(--ink-soft)}

/* Home */
.hello{font:500 18px var(--display);color:var(--ink-soft);margin-bottom:4px}
.intro{font-size:18px;line-height:1.7;margin-top:18px}
.intro + .intro{margin-top:0}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 26px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:500}
.chip.sun{background:var(--sun);color:var(--sun-ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);background:var(--win);color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 #C89418}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #C89418}
.btn svg{width:16px;height:16px}

/* Folder list */
.folder-head p{margin:0}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px}
.file{text-align:left;background:var(--win);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s, transform .15s}
.file:hover{border-color:var(--cobalt);transform:translateY(-2px)}
.file .ext{font:500 12px var(--mono);color:var(--ink-soft)}
.file p{font-size:14px;color:var(--ink-soft);margin:0}
.file .open-hint{margin-top:auto;padding-top:6px;font-size:13px;font-weight:600;color:var(--cobalt)}
.empty{margin-top:22px;padding:34px 24px;border:1.5px dashed var(--line);border-radius:12px;text-align:center;background:var(--tint)}
.empty p{margin:6px auto 0}

/* Detail view inside a folder */
.crumbs{display:flex;align-items:center;gap:6px;margin:-8px 0 18px;font-size:14px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:6px 8px 6px 4px;border-radius:8px;cursor:pointer;color:var(--cobalt);font-weight:600}
.back:hover{background:var(--cobalt-soft)}
.back svg{width:16px;height:16px}
.crumbs .sep{color:var(--ink-soft)}
.hero{padding:22px;border-radius:12px;background:var(--tint);border:1px solid var(--line)}
.hero-top{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start}
.hero-top > div{flex:1 1 260px;min-width:0}
.hero p{margin:4px 0 0;font-size:17px}
.stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.story{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:16px}
.story section{padding:18px 20px;border:1px solid var(--line);border-radius:12px}
.story h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.story h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sun);flex:none}
.story p{margin:0;font-size:15.5px;line-height:1.65}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pager .btn{font-weight:500}

/* Certificates */
.cert{cursor:default}
.cert:hover{transform:none;border-color:var(--line)}
.cert svg{width:40px;height:40px}
.cert a{font-size:13px;font-weight:600;text-decoration:none;margin-top:auto}

/* Resume */
.resume-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:24px}
.section{margin-top:26px}
.section > h3{margin-bottom:12px}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 18px 6px}
.timeline li::before{content:"";position:absolute;left:-26px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--win);border:2.5px solid var(--cobalt)}
.timeline li:first-child::before{background:var(--sun);border-color:var(--sun)}
.role{font-weight:600}
.when{font:400 13px var(--mono);color:var(--ink-soft)}
.skills{display:flex;flex-wrap:wrap;gap:6px}

/* Why */
.results{list-style:none;margin:16px 0 0;padding:0}
.results li{display:grid;grid-template-columns:80px 1fr;align-items:baseline;gap:14px;padding:9px 0;border-top:1px dashed var(--line)}
.results li:first-child{border-top:0}
.results b{font:800 24px var(--display);color:var(--cobalt);letter-spacing:-.02em}
.why{display:grid;gap:18px;margin-top:16px}
.why div{padding-left:14px;border-left:3px solid var(--sun)}
.why p{margin:4px 0 0}

/* Contact */
.contact-list{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.contact-list li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.contact-list .k{font-size:13px;color:var(--ink-soft);width:74px;flex:none}
.contact-list a{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500;text-decoration:none}
.copy{border:1px solid var(--line);background:var(--win-bar);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}

/* Terminal */
.term .win-body{background:#0F1522;color:#D6E0F0;font:14px/1.6 var(--mono);padding:18px 20px}
.term-out div{white-space:pre-wrap}
.term-line{display:flex;gap:8px}
.term-line span{color:var(--sun)}
.term input{flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;outline:none;caret-color:var(--sun)}
.t-accent{color:#9FB2FF}

/* Dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);z-index:5000;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:8px;border-radius:18px;background:var(--dock);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--shadow);max-width:calc(100vw - 16px)}
.dock-btn{position:relative;width:50px;height:50px;border-radius:12px;border:0;background:none;display:grid;place-items:center;cursor:pointer;transition:transform .12s;flex:none}
.dock-btn:hover{transform:translateY(-4px)}
.dock-btn svg{width:36px;height:36px}
.dock-btn.open::after{content:"";position:absolute;bottom:-3px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.dock-sep{width:1px;background:var(--line);margin:6px 2px;flex:none}
.tip{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--win);font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.dock-btn:hover .tip,.dock-btn:focus-visible .tip{opacity:1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--win);padding:8px 14px;border-radius:8px;font-size:14px;z-index:6000;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* Mobile */
@media (max-width:780px){
  .menu-btn,.clock{display:none}
  .icons{position:static;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:4px;padding:18px 10px 0}
  .icons.right{padding-top:0}
  .d-icon{width:84px}
  .win,.win.maxed{position:fixed;left:8px!important;right:8px;top:calc(48px + env(safe-area-inset-top,0px))!important;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:auto!important;height:auto!important;max-height:none!important}
  .win-bar{cursor:default}
  .win-body{padding:22px 18px 26px}
  .hero{padding:18px}
  .dock{gap:2px;padding:6px}
  .dock-btn{width:40px;height:40px}.dock-btn svg{width:30px;height:30px}
  .dock-sep{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function folderList(key){
  const f = FOLDERS[key];

  return `<div class="folder-head"><h2>${f.heading}</h2><p class="muted">${esc(f.intro)}</p></div>${list}`;
}

function folderDetail(key, id){
  const f = FOLDERS[key], i = f.items.findIndex(p => p.id === id), p = f.items[i];
  const prev = f.items[i - 1], next = f.items[i + 1];
  return `

}

/* ====== Window manager ====== */
const desktop = document.getElementById("desktop");
const open = new Map();
let z = 10, cascade = 0;
const isMobile = () => matchMedia("(max-width:780px)").matches;

function openWindow(id){
  const def = WINDOWS[id]; if (!def) return null;
  if (open.has(id)){ const w = open.get(id); w.classList.remove("minimized"); focusWin(w); updateDock(); return w; }
  const win = document.createElement("section");
  win.className = "win" + (def.cls ? " " + def.cls : "");
  win.setAttribute("role", "dialog"); win.setAttribute("aria-label", def.title);
  win.innerHTML = `<div class="win-bar"><div class="lights"><button class="light close" aria-label="Close"></button><button class="light min" aria-label="Minimize"></button><button class="light max" aria-label="Maximize"></button></div><span class="win-title">${esc(def.title)}</span></div><div class="win-body">${def.render()}</div>`;

  // Size and place so the whole window always fits inside the desktop
  const dw = desktop.clientWidth, dh = desktop.clientHeight;
  const w = Math.min(def.w, dw - 32);
  const off = (cascade++ % 5) * 26;
  const top = Math.min(16 + off, Math.max(8, dh * 0.08));
  const avail = dh - top - 12;
  win.style.width = w + "px";
  win.style.maxHeight = avail + "px";
  if (def.h) win.style.height = Math.min(def.h, avail) + "px";
  win.style.left = Math.min(Math.max(16, (dw - w) / 2 + off), dw - w - 16) + "px";
  win.style.top = top + "px";

  desktop.appendChild(win); open.set(id, win); focusWin(win);
  win.addEventListener("pointerdown", () => focusWin(win));
  win.querySelector(".close").onclick = () => { win.remove(); open.delete(id); updateDock(); };
  win.querySelector(".min").onclick = () => { win.classList.add("minimized"); updateDock(); };
  win.querySelector(".max").onclick = () => win.classList.toggle("maxed");
  win.querySelector(".win-bar").addEventListener("dblclick", () => win.classList.toggle("maxed"));
  makeDraggable(win);
  if (id === "terminal") initTerminal(win);
  updateDock();
  return win;
}
function focusWin(w){ w.style.zIndex = ++z; }

function showItem(key, id){
  const win = openWindow(key); if (!win) return;
  const body = win.querySelector(".win-body");
  body.innerHTML = id ? folderDetail(key, id) : folderList(key);
  win.querySelector(".win-title").textContent = id ? `${FOLDERS[key].title}/${FOLDERS[key].items.find(p => p.id === id).file}` : FOLDERS[key].title;
  body.scrollTop = 0;
  body.querySelector(".back, .file")?.focus({ preventScroll: true });
}

function makeDraggable(win){
  const bar = win.querySelector(".win-bar");
  bar.addEventListener("pointerdown", e => {
    if (e.target.closest("button") || isMobile() || win.classList.contains("maxed")) return;
    const sx = e.clientX, sy = e.clientY, ox = win.offsetLeft, oy = win.offsetTop;
    bar.setPointerCapture(e.pointerId);
    const move = ev => {
      const maxX = desktop.clientWidth - 80, maxY = desktop.clientHeight - 38;
      win.style.left = Math.min(maxX, Math.max(-win.offsetWidth + 80, ox + ev.clientX - sx)) + "px";
      win.style.top = Math.min(maxY, Math.max(0, oy + ev.clientY - sy)) + "px";
    };
    const up = () => { bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); };
    bar.addEventListener("pointermove", move); bar.addEventListener("pointerup", up);
  });
}

/* Global clicks */
document.addEventListener("click", e => {
  const it = e.target.closest("[data-item]");
  if (it){ const [k, id] = it.dataset.item.split(":"); showItem(k, id); return; }
  const b = e.target.closest("[data-back]");
  if (b){ showItem(b.dataset.back, null); return; }
  const o = e.target.closest("[data-open]");
  if (o){ openWindow(o.dataset.open); return; }
  const c = e.target.closest("[data-copy]");
  if (c){
    try { navigator.clipboard.writeText(c.dataset.copy).then(() => toast("Copied " + c.dataset.copy), () => toast("Select the text to copy it")); }
    catch { toast("Select the text to copy it"); }
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const top = [...open.values()].filter(w => !w.classList.contains("minimized")).sort((a,b) => b.style.zIndex - a.style.zIndex)[0];
  if (top) top.querySelector(".close").click();
});

/* Dock */
const DOCK = [["home","Welcome","home"],["projects","Projects","folder"],["cases","Case Studies","folderCase"],["certs","Certificates","folderCert"],["resume","Resume","doc"],["terminal","Terminal","terminal"],["contact","Contact","mail"]];
const dock = document.getElementById("dock");
dock.innerHTML = DOCK.map(([id,label,ic]) => `<button class="dock-btn" data-open="${id}" aria-label="${label}">${ICONS[ic]}<span class="tip">${label}</span></button>`).join("")
  + `<span class="dock-sep"></span>`
  + `<a class="dock-btn" href="${CONFIG.linkedin}" target="_blank" rel="noopener" aria-label="LinkedIn">${ICONS.linkedin}<span class="tip">LinkedIn</span></a>`
  + `<a class="dock-btn" href="${CONFIG.github}" target="_blank" rel="noopener" aria-label="GitHub">${ICONS.github}<span class="tip">GitHub</span></a>`;
function updateDock(){ dock.querySelectorAll("[data-open]").forEach(b => b.classList.toggle("open", open.has(b.dataset.open))); }

/* Terminal */
function initTerminal(win){
  const out = win.querySelector("#termOut"), input = win.querySelector("#termIn");
  const print = html => { const d = document.createElement("div"); d.innerHTML = html; out.appendChild(d); win.querySelector(".win-body").scrollTop = 1e6; };
  print(`Welcome to Elnaz OS. Type <span class="t-accent">help</span> to see what you can do.`);
  const all = [...PROJECTS.map(p => ["projects", p]), ...CASE_STUDIES.map(p => ["cases", p])];
  const cmds = {
    help: () => `Commands:\n  <span class="t-accent">whoami</span>     a quick intro\n  <span class="t-accent">projects</span>   list my projects\n  <span class="t-accent">cases</span>      list my case studies\n  <span class="t-accent">open</span> NAME  open one, e.g. open smartsync\n  <span class="t-accent">certs</span>      my certificates\n  <span class="t-accent">resume</span>     open my resume\n  <span class="t-accent">contact</span>    ways to reach me\n  <span class="t-accent">theme</span>      switch light or dark\n  <span class="t-accent">clear</span>      clear the screen`,
    whoami: () => `${esc(CONFIG.name)}\nTechnical Product Manager in Vancouver. Curious by default, happiest turning messy processes into products people enjoy.`,
    projects: () => PROJECTS.map(p => `  <span class="t-accent">${p.id.padEnd(12)}</span>${esc(p.tagline)}`).join("\n"),
    cases: () => CASE_STUDIES.length ? CASE_STUDIES.map(p => `  <span class="t-accent">${p.id.padEnd(12)}</span>${esc(p.tagline)}`).join("\n") : "First case studies are on the way.",
    certs: () => { openWindow("certs"); return CERTS.map(c => "  " + esc(c.name)).join("\n"); },
    resume: () => { openWindow("resume"); return "Opening resume.pdf"; },
    contact: () => { openWindow("contact"); return `${esc(CONFIG.email)}\n${esc(CONFIG.phone)}`; },
    theme: () => { toggleTheme(); return "Theme switched."; },
    clear: () => { out.innerHTML = ""; return null; }
  };
  input.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const raw = input.value.trim(); input.value = "";
    if (!raw) return;
    print(`<span style="color:var(--sun)">elnaz@portfolio ~ %</span> ${esc(raw)}`);
    const [cmd, ...rest] = raw.toLowerCase().split(/\s+/);
    if (cmd === "open"){
      const q = rest.join(" "); const hit = q && all.find(([, p]) => p.id.startsWith(q) || p.name.toLowerCase().startsWith(q));
      if (hit){ showItem(hit[0], hit[1].id); print(`Opening ${esc(hit[1].file)}`); }
      else print(`Nothing called "${esc(q)}". Type projects to see the list.`);
      return;
    }
    const r = cmds[cmd] ? cmds[cmd]() : `Command not found: ${esc(cmd)}. Type help for the list.`;
    if (r !== null) print(r);
  });
  win.addEventListener("click", () => input.focus());
  setTimeout(() => input.focus(), 50);
}

/* Theme */
function toggleTheme(){
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("eb-theme", root.dataset.theme); } catch {}
}
try { const t = localStorage.getItem("eb-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
document.getElementById("themeBtn").onclick = toggleTheme;

/* Clock and toast */
const clock = document.getElementById("clock");
const tick = () => clock.textContent = new Date().toLocaleString("en-CA", { weekday:"short", hour:"numeric", minute:"2-digit" });
tick(); setInterval(tick, 30000);
let tt; function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800); }

/* Start: welcome window, or a deep link like #resume, #certs, #projects/smartsync */
(() => {
  const [a, b] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (FOLDERS[a] && b && FOLDERS[a].items.some(p => p.id === b)) showItem(a, b);
  else openWindow(WINDOWS[a] ? a : "home");
})();
